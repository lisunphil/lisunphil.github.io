<!DOCTYPE html>
<html lang="{{ site.locale | default: 'en-US' | slice: 0, 2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  </head>

  <body class="home-site">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="home-header">
      <div class="home-shell home-nav">
        <a class="home-brand" href="{{ '/' | relative_url }}" aria-label="Li Sun, homepage">
          <span>Li Sun</span>
          <small>PhD Candidate · HKU</small>
        </a>
        <nav class="home-nav-links" aria-label="Primary navigation">
          <a href="#about">About</a>
          <a href="#research">Research</a>
          <a href="#publications">Publications</a>
          <a href="#service">Service</a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="home-footer">
      <div class="home-shell home-footer-inner">
        <p>&copy; {{ site.time | date: '%Y' }} Li Sun</p>
        <p>Institute of Data Science · The University of Hong Kong</p>
      </div>
    </footer>
  </body>
</html>
